{% extends "base.html" %}

{% block title %}Log in · Renewly{% endblock %}

{% block content %}
<div class="mx-auto mt-5" style="max-width: 380px;">
  <h1 class="h4 mb-4 text-center">Renewly</h1>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      {% if form.errors %}
      <div class="alert alert-danger py-2">Wrong username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-control" type="text" name="username" id="id_username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <div class="input-group">
            <input class="form-control" type="password" name="password" id="id_password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const password = document.getElementById('id_password');
  const toggle = document.getElementById('toggle-password');
  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', show);
    toggle.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
</script>
{% endblock %}
